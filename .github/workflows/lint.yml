name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP syntax check

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: |
          find src tests config database -type f \( -name '*.php' -o -name '*.stub' \) -print0 | xargs -0 -n1 php -l
